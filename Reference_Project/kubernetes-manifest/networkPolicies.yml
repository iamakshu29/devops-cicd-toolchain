# Namespace-wide DNS egress — applies to ALL pods in petclinic-dev.
# Centralises DNS access so individual policies don't repeat this rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: petclinic-dev
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-policy-one
  namespace: petclinic-dev
spec:
  podSelector:
    matchLabels:
      app: postgres

  policyTypes:
  - Ingress # allowed incoming traffic from app to db

  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: petclinic-app
    - podSelector:
        matchLabels:
          app: db-seed   # allow db-seed Job (init container + seed container)
    ports:
    - protocol: TCP
      port: 5432

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-policy-two
  namespace: petclinic-dev
spec:
  podSelector:
    matchLabels:
      app: petclinic-app

  policyTypes:
  - Ingress # allowed incoming traffic from ingress to app
  - Egress # allowed outgoing traffic to db from app

  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          app.kubernetes.io/instance: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080

  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432

---

# NetworkPolicy for the db-seed Job
# Grants egress to PostgreSQL (5432).
# DNS egress is handled by the namespace-wide allow-dns-egress policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-policy-db-seed
  namespace: petclinic-dev
spec:
  podSelector:
    matchLabels:
      app: db-seed

  policyTypes:
  - Egress

  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432