apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: petclinic-network-policy
  namespace: petclinic-dev
spec:
  podSelector:
    matchLabels:
      app: database

  policyTypes:
  - Ingress
  - Egress

  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          team: alpha
      podSelector:
        matchLabels:
          app: api
    ports:
    - protocol: TCP
      port: 80
  
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          team: alpha
      podSelector:
        matchLabels:
          app: api
    ports:
    - protocol: TCP
      port: 80