apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-resource-quota
  namespace: petclinic-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: "2Gi"
    limits.cpu: "4"
    limits.memory: "4Gi"
    configmaps: "10"
    persistentvolumeclaims: "4"
    pods: "9"
    replicationcontrollers: "20"
    secrets: "10"
    services: "10"
    services.loadbalancers: "2"