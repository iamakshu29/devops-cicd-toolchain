apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-role-binding
  namespace: petclinic-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-role
subjects:
- kind: ServiceAccount
  name: petclinic-sa
  namespace: petclinic-dev

#  kubectl create rolebinding dev-role-binding --role=dev-role --serviceaccount=petclinic-dev:petclinic-sa -n petclinic-dev --dry-run=client -o yaml > rolebinding.yml