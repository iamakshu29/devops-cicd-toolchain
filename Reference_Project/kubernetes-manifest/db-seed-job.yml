# The Job waits for PostgreSQL and the Petclinic schema to be ready, then runs the seed SQL once.
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-seed-sql
  namespace: petclinic-dev
data:
  seed.sql: |
    -- Idempotent seed using WHERE NOT EXISTS.
    -- Safe to re-run without needing a UNIQUE constraint on the types table.
    INSERT INTO types (name)
    SELECT v.name
    FROM (VALUES
      ('cat'),
      ('dog'),
      ('lizard'),
      ('snake'),
      ('bird'),
      ('hamster')
    ) AS v(name)
    WHERE NOT EXISTS (
      SELECT 1
      FROM types
      WHERE types.name = v.name
    );

    -- Verify
    SELECT id, name
    FROM types
    ORDER BY id;

---

# ----- Job: runs seed.sql against PostgreSQL -------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: db-seed
  namespace: petclinic-dev
spec:
  backoffLimit: 5

  template:
    metadata:
      labels:
        app: db-seed

    spec:
      restartPolicy: OnFailure

      # Wait for PostgreSQL to accept connections
      initContainers:
        - name: wait-for-postgres
          image: docker.io/postgres:15
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."

              until pg_isready \
                -h postgres-svc.petclinic-dev.svc.cluster.local \
                -U petclinic \
                -d petclinic; do

                echo "PostgreSQL not ready yet — sleeping 3s"
                sleep 3
              done

              echo "PostgreSQL is ready."

          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

        # Wait for the Petclinic schema to exist
        - name: wait-for-schema
          image: docker.io/postgres:15
          command:
            - sh
            - -c
            - |
              echo "Waiting for Petclinic schema..."

              until psql \
                -h postgres-svc.petclinic-dev.svc.cluster.local \
                -U petclinic \
                -d petclinic \
                -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='types';" \
                | grep -q 1; do

                echo "Schema not ready yet — sleeping 3s"
                sleep 3
              done

              echo "Petclinic schema is ready."

          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      # Run seed SQL
      containers:
        - name: seed
          image: docker.io/postgres:15
          command:
            - sh
            - -c
            - |
              echo "Running database seed..."

              psql \
                -h postgres-svc.petclinic-dev.svc.cluster.local \
                -U petclinic \
                -d petclinic \
                -v ON_ERROR_STOP=1 \
                -f /sql/seed.sql

              echo "Database seed completed successfully."

          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: seed-sql
              mountPath: /sql

      volumes:
        - name: seed-sql
          configMap:
            name: db-seed-sql