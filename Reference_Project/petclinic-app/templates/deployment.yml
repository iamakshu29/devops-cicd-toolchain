apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: {{ .Values.appName }}-app
    {{- include "petclinic-app.labels" . | nindent 4 }}
  name: {{ .Values.appName }}-app
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.app.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.app.maxUnavailable }}
      maxSurge: {{ .Values.app.maxSurge }}   
  selector:
    matchLabels:
      app: {{ .Values.appName }}-app
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}-app
    spec:
      containers:
      - image: {{ .Values.app.containerImage }}:{{ .Values.app.imageTag }}
        name: {{ .Values.appName }}

        env:
        - name: SPRING_DATASOURCE_URL
          value: {{ .Values.app.env.SPRING_DATASOURCE_URL }}

        - name: SPRING_DATASOURCE_USERNAME
          value: {{ .Values.app.env.SPRING_DATASOURCE_USERNAME }}

        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secret.postgres.name }}
              key: {{ .Values.secret.postgres.key }}
        
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: update
        
        livenessProbe:
          tcpSocket:
            port: {{ .Values.app.livenessProbe.tcpSocket.port }}
          initialDelaySeconds: {{ .Values.app.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.app.livenessProbe.periodSeconds }}

        readinessProbe:
          tcpSocket:
            port: {{ .Values.app.readinessProbe.tcpSocket.port }}
          initialDelaySeconds: {{ .Values.app.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.app.readinessProbe.periodSeconds }}

        resources:
          requests:
            cpu: {{ .Values.app.resources.requests.cpu }}
            memory: {{ .Values.app.resources.requests.memory }}
          limits:
            cpu: {{ .Values.app.resources.limits.cpu }}
            memory: {{ .Values.app.resources.limits.memory }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.appName }}-svc
    {{- include "petclinic-app.labels" . | nindent 4 }}
spec:
  ports:
  - port: {{ .Values.app.servicePort }}
  selector:
    app: {{ .Values.appName }}-app
