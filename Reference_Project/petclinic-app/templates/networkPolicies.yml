# Namespace-wide DNS egress — applies to ALL pods in petclinic-dev.
# Centralises DNS access so individual policies don't repeat this rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-policy-one
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: postgres

  policyTypes:
  - Ingress # allowed incoming traffic from app to db

  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: {{ .Values.appName }}-app
    - podSelector:
        matchLabels:
          app: db-seed
    ports:
    - protocol: TCP
      port: {{ .Values.db.servicePort }}

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-policy-two
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.appName }}-app

  policyTypes:
  - Ingress # allowed incoming traffic from ingress to app
  - Egress # allowed outgoing traffic to db from app

  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          app.kubernetes.io/instance: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: ingress-nginx
    ports:
    - protocol: TCP
      port: {{ .Values.app.servicePort }}
  
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: {{ .Values.dbName }}
    ports:
    - protocol: TCP
      port: {{ .Values.db.servicePort }}

---

# NetworkPolicy for the db-seed Job
# Grants egress to PostgreSQL (5432).
# DNS egress is handled by the namespace-wide allow-dns-egress policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-policy-db-seed
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: db-seed

  policyTypes:
  - Egress

  egress:
  - to:
    - podSelector:
        matchLabels:
          app: {{ .Values.dbName }}
    ports:
    - protocol: TCP
      port: {{ .Values.db.servicePort }}