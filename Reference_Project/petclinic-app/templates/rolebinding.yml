apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-role-binding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dev-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.appName }}-sa
  namespace: {{ .Release.Namespace }}

#  kubectl create rolebinding dev-role-binding --role=dev-role --serviceaccount=petclinic-dev:petclinic-sa -n petclinic-dev --dry-run=client -o yaml > rolebinding.yml
